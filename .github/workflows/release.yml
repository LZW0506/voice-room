name: 构建并发布桌面端

on:
  push:
    tags:
      - "app-v*"

permissions:
  contents: write

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: 构建 ${{ matrix.name }}
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Universal
            platform: macos-latest
            rustTargets: aarch64-apple-darwin,x86_64-apple-darwin
            args: --target universal-apple-darwin --bundles app,dmg
          - name: Windows x64
            platform: windows-latest
            rustTargets: ""
            args: --bundles nsis

    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 安装 Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rustTargets }}

      - name: 缓存 Rust 构建产物
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
          key: ${{ matrix.name }}

      - name: 安装前端依赖
        run: npm ci

      - name: 构建并发布安装包
        uses: tauri-apps/tauri-action@v0
        env:
          CARGO_INCREMENTAL: 0
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          args: ${{ matrix.args }}
          tagName: app-v__VERSION__
          releaseName: 声屿 v__VERSION__
          releaseBody: 下载 macOS 或 Windows 安装包，已安装版本会自动检查后续更新
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
          updaterJsonKeepUniversal: true
          retryAttempts: 3

  release:
    name: 发布桌面端版本
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: 将安装包地址切换到国内代理
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOWNLOAD_PROXY: https://gh-proxy.com/
        run: |
          release_json=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$GITHUB_REF_NAME")
          release_id=$(printf '%s' "$release_json" | jq -r '.id')
          updater_asset_id=$(printf '%s' "$release_json" | jq -r '.assets[] | select(.name == "latest.json") | .id')
          test -n "$updater_asset_id" && test "$updater_asset_id" != "null"

          curl --fail --location \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/octet-stream" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/assets/$updater_asset_id" \
            --output latest.json

          jq --arg proxy "$DOWNLOAD_PROXY" '
            .platforms |= with_entries(
              .value.url = if (.value.url | startswith($proxy)) then .value.url else ($proxy + .value.url) end
            )
          ' latest.json > latest.proxied.json

          curl --fail --request DELETE \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/assets/$updater_asset_id"

          curl --fail --request POST \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Content-Type: application/octet-stream" \
            --data-binary @latest.proxied.json \
            "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$release_id/assets?name=latest.json"

      - name: 发布完整 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false --repo "$GITHUB_REPOSITORY"
