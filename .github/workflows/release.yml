name: 构建并发布桌面端

on:
  push:
    tags:
      - "app-v*"

permissions:
  contents: write

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: 构建 ${{ matrix.name }}
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Universal
            platform: macos-latest
            rustTargets: aarch64-apple-darwin,x86_64-apple-darwin
            args: --target universal-apple-darwin --bundles app,dmg
          - name: Windows x64
            platform: windows-latest
            rustTargets: ""
            args: --bundles nsis
      max-parallel: 2

    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 安装 Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: 启用 Yarn
        run: corepack enable && corepack prepare yarn@1.22.22 --activate

      - name: 缓存前端依赖目录
        id: yarn-modules-cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-${{ runner.arch }}-node-modules-${{ hashFiles('yarn.lock') }}

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rustTargets }}

      - name: 缓存 Rust 构建产物
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
          key: ${{ matrix.name }}

      - name: 安装前端依赖
        if: steps.yarn-modules-cache.outputs.cache-hit != 'true'
        run: yarn install --frozen-lockfile --prefer-offline

      - name: 构建并发布安装包
        uses: tauri-apps/tauri-action@v0
        env:
          CARGO_INCREMENTAL: 0
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          tauriScript: yarn tauri
          args: ${{ matrix.args }}
          tagName: app-v__VERSION__
          releaseName: 声屿 v__VERSION__
          releaseBody: 下载 macOS 或 Windows 安装包，已安装版本会自动检查后续更新
          releaseDraft: true
          prerelease: false
          assetNamePattern: voice-room_[version]_[arch][setup][ext]
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
          updaterJsonKeepUniversal: true
          retryAttempts: 3

  release:
    name: 发布桌面端版本
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: 重写更新包下载地址
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p updater
          gh release download "$GITHUB_REF_NAME" --pattern latest.json --dir updater --repo "$GITHUB_REPOSITORY"
          sed -i 's#https://github.com/LZW0506/voice-room/releases/download/#https://gh-proxy.com/https://github.com/LZW0506/voice-room/releases/download/#g' updater/latest.json
          gh release upload "$GITHUB_REF_NAME" updater/latest.json --clobber --repo "$GITHUB_REPOSITORY"
      - name: 发布完整 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false --repo "$GITHUB_REPOSITORY"
