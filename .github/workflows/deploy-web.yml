name: 部署网页端

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: 构建并部署网页端
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装前端依赖
        run: npm ci

      - name: 构建网页端
        env:
          VITE_TOKEN_URL: /api/token
          VITE_LIVEKIT_URL: wss://82.157.174.249:8004
          VITE_TAURI_TOKEN_URL: http://82.157.174.249:8787/api/token
          VITE_TAURI_LIVEKIT_URL: ws://82.157.174.249:7880
        run: npm run build

      - name: 配置 SSH
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: 部署静态文件到 1Panel 网站目录
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh -o StrictHostKeyChecking=no "$DEPLOY_USER@$DEPLOY_HOST" \
            'mkdir -p /opt/1panel/www/sites/voice/index'
          rsync -az --delete -e 'ssh -o StrictHostKeyChecking=no' \
            dist/ "$DEPLOY_USER@$DEPLOY_HOST:/opt/1panel/www/sites/voice/index/"
