[package]
name = "voice-room"
version = "0.1.11"
description = "基于 LiveKit 的桌面语音聊天室"
authors = ["Voice Room"]
edition = "2021"

[lib]
name = "voice_room_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
machine-uid = "0.5"
tauri-plugin-updater = "2.11.0"
tauri-plugin-process = "2.3.1"
